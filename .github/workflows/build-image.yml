name: Build and publish frontend image

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify Next.js application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install locked dependencies
        run: yarn install --immutable

      - name: Run lint
        run: yarn lint

      - name: Run typecheck
        run: |
          yarn next typegen
          yarn typecheck

      - name: Check committed OpenAPI types
        run: yarn api:check

      - name: Run tests
        run: yarn test:run

      - name: Build application
        run: yarn build

  image:
    name: Build image
    needs: verify
    if: >-
      startsWith(github.ref, 'refs/heads/release/') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve image version from release branch
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#release/v}
          version_pattern='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?'
          [[ "$GITHUB_REF_NAME" == release/v* && "$version" =~ ^${version_pattern}$ ]] || { echo 'Use release/vX.Y.Z or release/vX.Y.Z-rc.N' >&2; exit 2; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=long,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  propose:
    name: Propose frontend image for production
    needs: image
    if: github.event_name == 'push'
    uses: pc-shopping-assistant-org/infra/.github/workflows/propose-image.yml@release/production
    with:
      component: web
      release_branch: ${{ github.ref_name }}
    secrets:
      INFRA_RELEASE_PR_TOKEN: ${{ secrets.INFRA_RELEASE_PR_TOKEN }}
