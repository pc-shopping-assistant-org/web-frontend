name: Build and publish frontend image

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/release' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify Next.js application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install locked dependencies
        run: yarn install --immutable

      - name: Run lint
        run: yarn lint

      - name: Run typecheck
        run: |
          yarn next typegen
          yarn typecheck

      - name: Check committed OpenAPI types
        run: yarn api:check

      - name: Run tests
        run: yarn test:run

      - name: Build application
        run: yarn build

  image:
    name: Build image
    needs: verify
    if: >-
      github.ref == 'refs/heads/release' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=release
            type=sha,format=long,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  deploy:
    name: Deploy frontend release
    needs: image
    if: >-
      github.ref == 'refs/heads/release' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    env:
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_USER: ${{ vars.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      RELEASE_COMPONENT: frontend
      IMAGE_TAG: sha-${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Deploy verified image over SSH
        shell: bash
        run: |
          set -euo pipefail
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/release" --jq .sha)
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo 'Skip superseded release; branch head has changed'
            exit 0
          fi
          : "${SSH_HOST:?Set release variable SSH_HOST}"
          : "${SSH_USER:?Set release variable SSH_USER}"
          : "${DEPLOY_PATH:?Set release variable DEPLOY_PATH}"
          : "${SSH_PRIVATE_KEY:?Set release secret SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Set release secret SSH_KNOWN_HOSTS}"
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ && "$DEPLOY_PATH" != / ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          key_file="$RUNNER_TEMP/gearpc-deploy-key"
          hosts_file="$RUNNER_TEMP/gearpc-known-hosts"
          trap 'rm -f -- "$key_file" "$hosts_file"' EXIT
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts_file"
          ssh -i "$key_file" -p "$SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o "UserKnownHostsFile=$hosts_file" \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$DEPLOY_PATH' '$RELEASE_COMPONENT' '$IMAGE_TAG'" <<'REMOTE'
          set -euo pipefail
          cd -- "$1"
          bash scripts/deploy-release.sh "$2" "$3"
          REMOTE
